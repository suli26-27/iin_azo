<h1>Beosztások</h1>

<button class="btn btn-primary"
(click)="showModal()">
    Hozzáadás
</button>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Id</th>
            <th>Név</th>
            <th>Leírás</th>
        </tr>
    </thead>
    <tbody>
        @for( pos of positions() ; track pos.id) {
            <tr>
                <td>{{ pos.id }}</td>
                <td>{{ pos.name }}</td>
                <td>{{ pos.description }}</td>
            </tr>
        }
    </tbody>

</table>



@if(visibleModal) {
    <div class="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">
                {{addMode ? 'Hozzáadás' : 'Módosítás'}}
            </h5>
            <button type="button" class="btn-close" 
            data-bs-dismiss="modal" aria-label="Close"
            (click)="startHideModal()"></button>
        </div>
        <div class="modal-body">
            <form [formGroup]="positionForm" (ngSubmit)="savePosition()"
            id="positionForm">
                @if(!addMode) {
                    <div>
                        <label for="id" class="form-label">Id</label>
                        <input type="text" class="form-control" id="id"
                        formControlName="id" readonly>
                    </div>

                }
                <div>
                    <label for="name" class="form-label">Név</label>
                    <input type="text" class="form-control" id="name"
                    formControlName="name">
                </div>
                <div>
                    <label for="description" class="form-label">Leírás</label>
                    <input type="text" class="form-control" id="description"
                    formControlName="description">
                </div>
            </form>


        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" 
            data-bs-dismiss="modal" (click)="startHideModal()">Bezárás</button>
            <button type="button" class="btn btn-primary"
            form="positionForm">Mentés</button>
        </div>
        </div>
    </div>
    </div>    
}
